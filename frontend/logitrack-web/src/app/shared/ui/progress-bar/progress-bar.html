<div class="gap-space-xs flex flex-col">
  <div class="gap-space-sm flex items-center justify-between">
    <span [id]="labelId" class="font-label-md text-label-md text-on-surface">{{ label() }}</span>
    <span class="font-telemetry-md text-telemetry-md text-on-surface">{{ percent() }}%</span>
  </div>
  <div
    role="progressbar"
    class="bg-surface-container h-2 w-full overflow-hidden rounded-full"
    aria-valuemin="0"
    [attr.aria-valuemax]="max()"
    [attr.aria-valuenow]="value()"
    [attr.aria-labelledby]="labelId"
  >
    <div class="bg-secondary-container h-full rounded-full" [style.width.%]="percent()"></div>
  </div>
  @if (supportText(); as text) {
    <span class="font-label-sm text-label-sm text-on-surface-variant">{{ text }}</span>
  }
</div>
