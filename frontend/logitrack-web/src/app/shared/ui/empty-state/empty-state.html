<div [class]="classes()">
  <div
    class="bg-surface-container-lowest text-secondary shadow-soft flex h-10 w-10 items-center justify-center rounded-full"
  >
    <lt-icon [name]="icon()" size="lg" />
  </div>
  <div class="gap-space-xs flex flex-col">
    <p class="font-label-lg text-label-lg text-on-surface font-bold">{{ title() }}</p>
    @if (description(); as text) {
      <p class="font-body-sm text-body-sm text-on-surface-variant mx-auto max-w-md">{{ text }}</p>
    }
  </div>
  <ng-content />
</div>
