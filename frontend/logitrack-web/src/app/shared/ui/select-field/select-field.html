<div class="gap-space-xs bg-surface-container-low px-space-md flex items-center rounded-lg">
  <label [for]="selectId" class="font-label-sm text-label-sm text-on-surface-variant">{{
    label()
  }}</label>
  <select
    [id]="selectId"
    (change)="onChange($event)"
    class="text-body-lg text-on-surface focus-visible:ring-secondary @md:text-body-md min-h-11 cursor-pointer bg-transparent focus:outline-none focus-visible:ring-2"
  >
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
</div>
