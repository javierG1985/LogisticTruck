<div
  role="status"
  aria-live="polite"
  class="inset-x-gutter bottom-gutter gap-space-sm sm:right-gutter-desktop pointer-events-none fixed z-50 flex flex-col sm:left-auto sm:w-96"
>
  @for (item of items(); track item.id) {
    <div [class]="item.classes" class="pointer-events-auto">
      <lt-icon [name]="item.icon" />
      <p class="font-body-md text-body-md min-w-0 flex-1">{{ item.message }}</p>
      <lt-icon-button icon="close" label="Cerrar aviso" (click)="dismiss(item.id)" />
    </div>
  }
</div>
