<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>LogiTrack</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Aplica el tema antes del primer pintado para evitar el parpadeo. Mismo criterio que ThemeService. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('lt-theme');
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          // Sin almacenamiento o sin matchMedia, la página se muestra en claro.
        }
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface font-sans antialiased">
    <lt-root></lt-root>
  </body>
</html>
