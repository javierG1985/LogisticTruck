services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: logitrack-postgres
    environment:
      POSTGRES_DB: logitrack
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: logitrack_dev
    ports:
      # 5433 en el host: 5432 puede estar ocupado por una instalación local de PostgreSQL.
      - "5433:5432"
    volumes:
      # PostgreSQL 18 guarda los datos bajo /var/lib/postgresql/18/docker: el volumen va en la raíz.
      - logitrack-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack -d logitrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  logitrack-pgdata:
